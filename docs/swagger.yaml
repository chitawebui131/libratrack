basePath: /api/v1
definitions:
  model.Book:
    properties:
      author:
        type: string
      category:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      isbn:
        type: string
      publishedYear:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.CreateBookRequest:
    properties:
      author:
        type: string
      category:
        type: string
      description:
        type: string
      isbn:
        type: string
      published_year:
        type: integer
      title:
        type: string
    required:
    - author
    - category
    - isbn
    - title
    type: object
  model.UpdateBookRequest:
    properties:
      author:
        type: string
      category:
        type: string
      description:
        type: string
      isbn:
        type: string
      published_year:
        type: integer
      title:
        type: string
    required:
    - author
    - category
    - isbn
    - title
    type: object
info:
  contact: {}
  description: This is a sample server for Libratrack
  title: Libratrack API
  version: "1.0"
paths:
  /books:
    get:
      description: Get list of books with optional filtering
      parameters:
      - description: Filter by category
        in: query
        name: category
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Book'
            type: array
      summary: List books
      tags:
      - books
    post:
      consumes:
      - application/json
      description: Create a new book in the catalog
      parameters:
      - description: Book data
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/model.CreateBookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Book'
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: Create a new book
      tags:
      - books
  /books/{id}:
    delete:
      description: Delete a book by ID
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete a book
      tags:
      - books
    get:
      description: Get a single book by its ID
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Book'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get a book by ID
      tags:
      - books
    put:
      consumes:
      - application/json
      description: Update an existing book
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      - description: Book data
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/model.UpdateBookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Book'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: Update a book
      tags:
      - books
swagger: "2.0"
